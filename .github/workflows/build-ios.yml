name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - feat/native-ios
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Unsigned iOS App
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CONFIGURATION_BUILD_DIR=$(pwd)/build/Release-iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          
          # Convert .app to .ipa
          mkdir -p Payload
          mv build/Release-iphoneos/App.app Payload/
          zip -r LocaLyly-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocaLyly-iOS-Unsigned
          path: ios/App/LocaLyly-iOS.ipa
